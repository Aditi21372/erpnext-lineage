[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erpnext-lineage"
version = "1.1.0"
description = "Evidence-backed static lineage graph for frappe_docker + ERPNext, with query tools, small views, and a grounded LLM agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lineage = "lineage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineage = ["vendor/*.js", "vendor/README.md"]
